name: Convert DOCX to Markdown

on:
  workflow_dispatch:
  push:
    paths:
      - "docx/**"
      - ".github/workflows/**"

jobs:
  convert-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert .docx files to Markdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p md
          shopt -s nullglob

          for file in docx/*.docx; do
            [ -f "$file" ] || continue

            name="$(basename "${file%.docx}")"
            output="md/${name}.md"

            docker run --rm \
              -v "$PWD:/data" \
              -w /data \
              pandoc/core:3.5 \
              pandoc "$file" \
                --from=docx \
                --to=gfm \
                --wrap=none \
                --output="$output"
          done

      - name: Commit generated Markdown files only when changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add md

          if git diff --cached --quiet -- md; then
            echo "No new or updated Markdown files detected."
          else
            git commit -m "Convert DOCX files to Markdown"
            git push
          fi
