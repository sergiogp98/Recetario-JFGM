name: Convert DOCX to Markdown

on:
  workflow_dispatch:
  push:
    paths:
      - "docx/**"
      - ".github/workflows/**"

jobs:
  convert-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Convert .docx files to HTML
        run: |
          mkdir -p html
          
          table_of_content=""
          for file in docx/*.docx; do
            name="$(basename "${file%.docx}")"
            encoded_name="${name// /%20}"

            pandoc \
              --from=docx \
              --to=html \
              --standalone \
              --metadata="title=${name}" \
              --output="html/${name}.html" \
              "$file"

            table_of_content=$(printf '%s\n- [%s](html/%s.html)' \
              "$table_of_content" \
              "$name" \
              "$encoded_name")
          done
          printf '%s\n' "$table_of_content" > README.md
      - name: Commit generated Markdown files only when changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add html README.md

          if git diff --cached --quiet -- html README.md; then
            echo "No new or updated HTML files detected."
          else
            git commit -m "Convert DOCX files to HTML"
            git push
          fi
